<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2a7a"/>
      <stop offset="1" stop-color="#2b1750"/>
    </linearGradient>
    <linearGradient id="paddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#ff9f4a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="40" fill="url(#bg)"/>

  <!-- three bitmoji-style brick faces -->
  <g>
    <rect x="30" y="48" width="66" height="56" rx="14" fill="#6bc9ff"/>
    <circle cx="51" cy="72" r="6" fill="#1a1033"/>
    <circle cx="75" cy="72" r="6" fill="#1a1033"/>
    <path d="M51 86 Q63 98 75 86" stroke="#1a1033" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="102" y="38" width="66" height="56" rx="14" fill="#ff8fb3"/>
    <circle cx="123" cy="62" r="7" fill="#1a1033"/>
    <line x1="146" y1="62" x2="158" y2="62" stroke="#1a1033" stroke-width="5" stroke-linecap="round"/>
    <path d="M123 76 Q135 88 147 76" stroke="#1a1033" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="174" y="50" width="58" height="52" rx="14" fill="#8fe3a0"/>
    <circle cx="192" cy="74" r="8" fill="#1a1033"/>
    <circle cx="214" cy="74" r="8" fill="#1a1033"/>
    <path d="M192 90 Q203 100 214 90" stroke="#1a1033" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ball -->
  <circle cx="128" cy="150" r="13" fill="#ffffff"/>
  <ellipse cx="128" cy="160" rx="12" ry="4" fill="#000000" opacity="0.2"/>

  <!-- paddle -->
  <rect x="78" y="186" width="100" height="18" rx="9" fill="url(#paddle)"/>

  <text x="128" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-weight="800" font-size="30" fill="#ffffff" letter-spacing="1">BRICKMOJI</text>
</svg>
